# Weekly dependency PRs. Every PR gets a Vercel preview and so a Neon branch
# (START-HERE 10f), and Neon Free allows 10: main, test, two Release snapshots
# and one per open PR. So minor and patch updates arrive as one grouped PR,
# and at most three version-update PRs are open at once. Security updates are
# not counted by these limits; the repo's Grouped security updates setting
# keeps them to one PR. A major update comes on its own. One that has to wait
# goes under `ignore` below, with why, rather than in a PR comment.
# Merging a bump is not deploying it: Release puts it live (Step 13).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 ships no JavaScript API (a new one is due in 7.1). Next.js
      # 15 reads tsconfig through it and crashes loading next.config.ts, and
      # typescript-eslint requires <6.1 (#13). Remove once both support 7.
      # 6.x is still offered.
      - dependency-name: typescript
        versions: [">=7"]
      # ESLint 10 removed context.getFilename(), which eslint-plugin-react
      # (through eslint-config-next) still calls: lint crashes loading
      # react/display-name (#83). Its 7.37.5 peers on eslint ^9.7. Remove once
      # eslint-plugin-react supports 10. 9.x is still offered.
      - dependency-name: eslint
        versions: [">=10"]
    commit-message: { prefix: deps }

  # Lighthouse and puppeteer-core, pinned exactly (task 0.10). Installed only by
  # the Lighthouse workflow; a bump's PR measures its own preview with itself.
  - package-ecosystem: npm
    directory: /scripts/perf
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      perf:
        patterns: ["*"]
    commit-message: { prefix: deps }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
    commit-message: { prefix: ci }
