# Starts PostgreSQL on the runner for CI's tests and the backup's restore check,
# and sets PG_MAJOR for the rest of the job. This is the one place PG_MAJOR is
# set: Neon's major, so a view or migration that works here behaves the same on
# the live database, and pg_dump (which refuses a newer server) can dump Neon.
#
# Installed from the PGDG apt repo, not pulled as a container: anonymous image
# pulls from GitHub's shared runner IPs hit rate limits on Docker Hub and on
# Amazon's mirror ("toomanyrequests: Data limit exceeded", 2026-10-15, D-66).
name: Start PostgreSQL
description: Install postgresql-$PG_MAJOR from PGDG and run it on localhost:5432 (user postgres, trust auth)

inputs:
  database:
    description: The database to create
    required: true

runs:
  using: composite
  steps:
    - name: Set PG_MAJOR
      shell: bash
      run: echo "PG_MAJOR=18" >> "$GITHUB_ENV"

    # A mirror that stops answering must fail fast and be retried, not hang:
    # one shard sat silent in this step until its 20-minute job timeout while
    # the other three took 16s (PR #218, 2026-11-10). apt's own timeouts and
    # retries cover every fetch, including the update the PGDG script runs;
    # `timeout` caps each attempt for a stall apt doesn't notice. Only the
    # network work is capped: packages are fetched with --download-only first,
    # so a kill never lands in the middle of dpkg unpacking them. The fetches
    # print their Get/Hit lines, so the log shows which mirror stalled.
    - name: Install PostgreSQL
      shell: bash
      env:
        ATTEMPT_SECONDS: "180"
      run: |
        printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
          | sudo tee /etc/apt/apt.conf.d/80-ci-network > /dev/null
        fetch() {
          for attempt in 1 2 3; do
            if sudo timeout "$ATTEMPT_SECONDS" "$@"; then return 0; fi
            echo "::warning::Attempt $attempt of 3 failed or passed ${ATTEMPT_SECONDS}s: $*"
            sleep 5
          done
          echo "::error::Gave up after 3 attempts: $*"
          return 1
        }
        fetch apt-get update -q
        fetch apt-get install -y -q --download-only postgresql-common
        sudo apt-get install -y -qq postgresql-common
        # Binaries only: the next step starts its own server, so apt creates none.
        echo "create_main_cluster = false" | sudo tee -a /etc/postgresql-common/createcluster.conf > /dev/null
        fetch /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
        fetch apt-get install -y -q --download-only "postgresql-$PG_MAJOR"
        sudo apt-get install -y -qq "postgresql-$PG_MAJOR"
        # The runner image ships its own PostgreSQL, and /usr/bin/pg_dump is a
        # wrapper that can pick that one; put this major's binaries first.
        echo "/usr/lib/postgresql/$PG_MAJOR/bin" >> "$GITHUB_PATH"

    # Neon's collation (builtin C.UTF-8), so ORDER BY sorts here as it does there.
    # Trust auth: the server lives only as long as the job, on localhost.
    #
    # The server log records what is slow, so a test that times out on the
    # runner says why (run_readiness's R0-12 test, #91 and #94): any statement
    # over a second, with its plan (estimated cost, and whether JIT was planned)
    # from auto_explain, plus lock waits and autovacuum runs. auto_explain
    # doesn't ANALYZE, so the other statements pay nothing. Checkpoints are
    # logged by default. PGLOG names the file for the job's later steps.
    #
    # JIT is off, as it is on Neon, which has no JIT provider
    # (pg_jit_available() is false there). PGDG's package installs one here,
    # and on freshly truncated test tables the planner's default row guesses
    # put run_readiness at cost 1.6M: JIT then spent over 5s compiling 100
    # functions for a six-row query (PR #95's first run).
    # test/test-db-jit.test.ts holds the test database to it.
    - name: Start PostgreSQL
      shell: bash
      env:
        DATABASE: ${{ inputs.database }}
      run: |
        set -euo pipefail
        bin="/usr/lib/postgresql/$PG_MAJOR/bin"
        "$bin/initdb" -D "$RUNNER_TEMP/pgdata" -U postgres --auth=trust -E UTF8 \
          --locale=C.UTF-8 --locale-provider=builtin --builtin-locale=C.UTF-8 > /dev/null
        "$bin/pg_ctl" -D "$RUNNER_TEMP/pgdata" -l "$RUNNER_TEMP/postgres.log" \
          -o "-p 5432 -k $RUNNER_TEMP -c jit=off \
              -c log_min_duration_statement=1000 -c log_lock_waits=on \
              -c log_autovacuum_min_duration=0 \
              -c shared_preload_libraries=auto_explain \
              -c auto_explain.log_min_duration=1000 -c auto_explain.log_format=text" \
          -w start
        echo "PGLOG=$RUNNER_TEMP/postgres.log" >> "$GITHUB_ENV"
        "$bin/createdb" -h localhost -U postgres "$DATABASE"
        "$bin/psql" -h localhost -U postgres -d "$DATABASE" -tAc "SELECT version()"
