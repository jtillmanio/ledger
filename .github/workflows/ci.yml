name: CI

on:
  pull_request:
  push: { branches: [main] }

# A newer push to a PR cancels its older run. Runs on main are never
# cancelled: Release checks CI on the exact commit it promotes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Tests only ever see TEST_DATABASE_URL (R3-02). There is deliberately no
      # DATABASE_URL here, so nothing in this job can mistake one for the other.
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/reading_test
      OWNER_ID: test
      SESSION_SECRET: ci-only-not-a-real-secret
      APP_PASSCODE: ci
    steps:
      - uses: actions/checkout@v7
        # check:migrations diffs drizzle/ against main, so it needs main's history.
        with: { fetch-depth: 0 }
      # Every docs/tasks/TASK-*.md front matter parses (the kit's dispatcher
      # and skills read it); INDEX.md itself is git-ignored.
      - name: Task files parse cleanly
        run: ./.claude/scripts/build-index.ps1
        shell: pwsh
      # Neon's major version, installed on the runner rather than pulled as an
      # image (D-66). A view or migration that works here then behaves the same
      # on the live database.
      - name: Start PostgreSQL
        uses: ./.github/actions/start-postgres
        with:
          database: reading_test
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }   # one Node version: .nvmrc = engines.node = Vercel
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: npm ci
      - run: pip install pandas openpyxl
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:tokens   # colour tokens: parity, hue distance, on-fill contrast (D-24)
      # Journal and files agree, a drop or retype ships a down file, schema.ts has
      # no ungenerated change, and no migration already on main was edited (rule 3).
      - run: npm run check:migrations
      # Applies drizzle/*.sql through drizzle-kit migrate, then etl/views.sql:
      # the same path a rebuild takes, so a broken migration cannot ship green.
      - run: npm run test:db:reset
      - run: npm test
      # What the server found slow while the tests ran (start-postgres logs any
      # statement over a second, with its plan, and lock waits). Printed even
      # when the tests pass, so a near miss shows before it becomes a timeout.
      - name: Slow statements and lock waits
        if: always() && env.PGLOG != ''
        run: |
          echo "::group::PostgreSQL log ($PGLOG)"
          cat "$PGLOG"
          echo "::endgroup::"
          if grep -qE "duration: |still waiting for|JIT:" "$PGLOG"; then
            echo "::warning::PostgreSQL logged a slow statement or a lock wait during the tests; see the log above."
          fi
      - run: npm run test:views
      - run: python -m unittest discover -s etl -p "test_*.py"
      - run: npm run build
        env:
          DATABASE_URL: postgresql://build:unused@localhost:5432/build_unused
