name: Lighthouse

# Every preview measures itself (task 0.10). When Vercel reports a preview
# deployment ready, this signs in to it, runs Lighthouse (mobile, devtools
# throttling: Slow 4G, 4× CPU, one run per route, Next's RSC prefetches
# blocked) and 0.9's tap → next-paint runner (one run per route, prefetches
# kept) over scripts/perf/routes.mjs, and answers the PR with one comment,
# updated in place. Task 0.14 cut it from three runs of each to one.
#
#   plan     the URL (previews only), the routes, and the PR this run belongs to
#   measure  one job per route, side by side: a run takes as long as its
#            slowest route, not the sum of them
#   report   merge, compare with the last merged PR's run, comment, gate
#
# A newer push to the same PR cancels this run's measuring and reporting: only
# the newest commit's numbers matter, and abandoned runs cost Actions minutes.
#
# It fails only on what holds still between runs: a route handler (/api/*)
# requested during a load or prefetch, bytes or requests over
# scripts/perf/budget.json, CLS of 0.1 or more, accessibility under its recorded
# score, and (task 0.13, D-142) growth over main's last measured run: JS by more
# than 3,000 bytes, document + RSC by more than 10% and 1,500 bytes, requests by
# more than 3. The owner's `perf-growth` label accepts the growth; adding or
# removing it re-runs only the head's last report job (rejudge), which loads no
# page and is not a measured run. Timings are reported against main's last
# measured run, never gated.
#
# Never production on its own: Release's smoke test owns it, and a pass there
# reads the live database through the app. A hand run there is the owner's call
# (allow_production). Reports are this run's artifacts for 14 days and go
# nowhere else: they hold the rendered pages, the library and reading history.
# The merged numbers (lighthouse-metrics, numbers only) are kept 90 days, so a
# later PR nearly always finds a baseline.
#
# The switch (D-158). Every page load here is a server render on Vercel, and
# each one's link prefetches render more: a measured deploy cost about 22 s of
# the Hobby plan's 4 h a month of Fluid Active CPU, shared with every project
# on the account. So a preview is measured on its own only while the repo
# variable LIGHTHOUSE_MODE is `on`; unset or anything else is off.
#   gh variable set LIGHTHOUSE_MODE --body on      (or off)
# A hand run measures whatever the switch says:
#   gh workflow run lighthouse.yml --ref <branch>  that branch head's preview,
#                                                  reported on its PR as if it
#                                                  had just deployed
#   ... -f url=<deployment URL>                    any deployment, summary only
#   ... -f dry_run=true                            plan only: loads no page, and
#                                                  prints what an automatic run
#                                                  would decide (wait and cap)
#
# Debounce and cap (task 0.14b). An automatic run (a real deployment_status)
# waits 5 minutes in plan, then measures only if its commit is still the PR's
# head; otherwise it logs why and loads nothing, and the newer push's run
# answers. It also stops once the UTC calendar month's automatic measured runs
# (runs whose measure job reached a runner) reach the repo variable
# LIGHTHOUSE_MONTHLY_CAP, default 100 when unset, and says so in the PR comment:
#   gh variable set LIGHTHOUSE_MONTHLY_CAP --body <n>   (0: no automatic run measures)
# A count GitHub can't give means not measuring. The first run the cap stops
# leaves an artifact, lighthouse-cap-reached-<YYYY-MM>-<cap>, and the month's
# later runs find it and don't count again. A hand run is exempt from both: it
# neither waits nor is capped, and it is not counted.
#
# GitHub runs a deployment's workflow from that deployment's commit, so a
# branch cut before the switch still measures on its own until it is rebased;
# while one is open, keep the workflow disabled (gh workflow disable
# lighthouse.yml) and enable it to run by hand.
on:
  deployment_status:
  # The perf-growth label (task 0.13): rejudge only, never a measurement.
  pull_request:
    types: [labeled, unlabeled]
  workflow_dispatch:
    inputs:
      url:
        description: "Deployment to measure, e.g. https://ledger-<id>-justin-tillman.vercel.app. Blank: the preview of the branch you run this on"
        required: false
        type: string
      allow_production:
        description: "The URL may be production (reads the live database through the app)"
        type: boolean
        default: false
      dry_run:
        description: "Plan only: say what would be measured, load no page"
        type: boolean
        default: false

permissions: {}

jobs:
  plan:
    # Vercel sends a status for every deployment and every state; only a
    # finished preview while the switch is on, or a hand run, gets this far.
    # report.mjs plan checks again and refuses production's URL.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.LIGHTHOUSE_MODE == 'on' &&
       github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview')
    runs-on: ubuntu-latest
    # An automatic run waits 5 minutes in here before it decides (task 0.14b).
    timeout-minutes: 12
    permissions:
      contents: read
      deployments: read
      # Counts this month's automatic measured runs against the cap (0.14b).
      actions: read
      # The cap's skip says so in the PR's one Lighthouse comment (0.14b).
      pull-requests: write
    outputs:
      url: ${{ steps.plan.outputs.url }}
      group: ${{ steps.plan.outputs.group }}
      routes: ${{ steps.plan.outputs.routes }}
      # A hand run on a branch replays its preview's deployment_status, so the
      # report answers the PR the way an automatic run does.
      event: ${{ steps.preview.outputs.url && 'deployment_status' || github.event_name }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ github.event.deployment.sha || github.sha }}" }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc }
      # Reads GitHub only, never the deployment: the newest Preview deployment
      # of this commit whose status reached success.
      - name: Find the branch's preview
        id: preview
        if: github.event_name == 'workflow_dispatch' && inputs.url == ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url=""
          for id in $(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$SHA&environment=Preview&per_page=20" --jq '.[].id'); do
            url=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=30" \
              --jq '[.[] | select(.state == "success" and .environment_url != null and .environment_url != "")][0].environment_url // empty')
            [ -n "$url" ] && break
          done
          if [ -z "$url" ]; then
            echo "::error::${SHA:0:7} has no ready preview: Vercel skipped it (docs, tests or config only), or it is still building. Run again once it deploys, or pass -f url=<deployment URL>."
            exit 1
          fi
          echo "Found ${SHA:0:7}'s preview: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.deployment.sha || github.sha }}
          EVENT_NAME: ${{ steps.preview.outputs.url && 'deployment_status' || github.event_name }}
          # The trigger before the replay: only a real deployment_status waits
          # and is capped; a hand run is exempt from both (task 0.14b).
          REAL_EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          LIGHTHOUSE_MONTHLY_CAP: ${{ vars.LIGHTHOUSE_MONTHLY_CAP }}
          DEPLOY_ENVIRONMENT: ${{ steps.preview.outputs.url && 'Preview' || github.event.deployment.environment }}
          DEPLOY_STATE: ${{ steps.preview.outputs.url && 'success' || github.event.deployment_status.state }}
          DEPLOY_URL: ${{ steps.preview.outputs.url || github.event.deployment_status.environment_url }}
          INPUT_URL: ${{ inputs.url }}
          ALLOW_PRODUCTION: ${{ inputs.allow_production }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: node scripts/perf/report.mjs plan
      # When the cap stops an automatic run, the month's later runs find this
      # artifact and skip the count (0.14b). Its name carries the month and
      # the cap; 31 days outlast the month it was written in.
      - name: Mark the month's cap reached
        if: steps.plan.outputs.cap_marker
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.plan.outputs.cap_marker }}
          path: ${{ runner.temp }}/lighthouse-cap.txt
          retention-days: 31
          if-no-files-found: error
      - name: Dry run
        if: inputs.dry_run && steps.plan.outputs.url
        env:
          URL: ${{ steps.plan.outputs.url }}
          GROUP: ${{ steps.plan.outputs.group }}
        run: |
          echo "Dry run: a hand run would measure $URL ($GROUP). No page was loaded."

  measure:
    needs: plan
    if: needs.plan.outputs.url && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        route: ${{ fromJSON(needs.plan.outputs.routes) }}
    concurrency:
      group: lighthouse-${{ needs.plan.outputs.group }}-${{ matrix.route }}
      cancel-in-progress: true
    env:
      SHA: ${{ github.event.deployment.sha || github.sha }}
      TARGET_URL: ${{ needs.plan.outputs.url }}
      PERF_ROUTES: ${{ matrix.route }}
    steps:
      # The session lives outside the reports folder, and only for this job.
      - name: Folders
        run: |
          echo "HEADERS_DIR=$RUNNER_TEMP/lh-session" >> "$GITHUB_ENV"
          echo "OUT_DIR=$RUNNER_TEMP/lighthouse" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with: { ref: "${{ github.event.deployment.sha || github.sha }}" }
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: scripts/perf/package-lock.json
      - run: npm ci --prefix scripts/perf --no-audit --no-fund

      # Secrets reach scripts through env only, never through run: text. The
      # scripts mask the passcode, the bypass secret and the new session cookie.
      - name: Sign in
        env:
          APP_PASSCODE: ${{ secrets.APP_PASSCODE }}
          # Vercel → Settings → Deployment Protection → Protection Bypass for Automation (10e)
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/perf/login.mjs

      - name: Measure
        env:
          APP_PASSCODE: ${{ secrets.APP_PASSCODE }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/perf/measure.mjs

      - name: No secret in the reports
        env:
          APP_PASSCODE: ${{ secrets.APP_PASSCODE }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/perf/report.mjs guard "$OUT_DIR"

      - name: Forget the session
        if: always()
        run: rm -rf "$HEADERS_DIR"

      - name: Upload the reports
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports-${{ matrix.route }}
          path: ${{ runner.temp }}/lighthouse/reports
          retention-days: 14
          # A route that never loaded (a shelf's page with no shelf, task 0.14c) writes no
          # report, only metrics.json naming why: upload that rather than fail the job here.
          if-no-files-found: warn

      - name: Upload the metrics
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-metrics-${{ matrix.route }}
          path: ${{ runner.temp }}/lighthouse/metrics.json
          retention-days: 14
          if-no-files-found: error

  report:
    needs: [plan, measure]
    # Also when a route's job failed: its route is then reported as not
    # measured. Not when a newer push cancelled the measuring.
    if: ${{ !cancelled() && needs.plan.outputs.url && !inputs.dry_run && needs.measure.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The one job that writes anything: the PR comment.
    permissions:
      contents: read
      actions: read
      pull-requests: write
    concurrency:
      group: lighthouse-${{ needs.plan.outputs.group }}-report
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.deployment.sha || github.sha }}
      EVENT_NAME: ${{ needs.plan.outputs.event }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ github.event.deployment.sha || github.sha }}" }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc }
      - uses: actions/download-artifact@v8
        with:
          pattern: lighthouse-metrics-*
          path: ${{ runner.temp }}/parts

      - name: Merge the routes
        run: node scripts/perf/report.mjs merge "$RUNNER_TEMP/parts"

      # Numbers only: what the next PR compares itself with, kept 90 days (task
      # 0.13). A rejudge re-runs this job on the same numbers, which attempt 1
      # already uploaded.
      - name: Upload the metrics
        if: github.run_attempt == 1
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-metrics
          path: ${{ runner.temp }}/parts/metrics.json
          retention-days: 90
          if-no-files-found: error

      - name: Find main's last run
        id: baseline
        run: node scripts/perf/report.mjs baseline

      # Gone after 90 days; the comment then says there is no baseline.
      - name: Fetch its metrics
        if: steps.baseline.outputs.run_id
        continue-on-error: true
        run: gh run download "${{ steps.baseline.outputs.run_id }}" -R "$GITHUB_REPOSITORY" -n lighthouse-metrics -D "$RUNNER_TEMP/baseline"

      - name: Report
        env:
          METRICS: ${{ runner.temp }}/parts/metrics.json
          BASELINE_METRICS: ${{ runner.temp }}/baseline/metrics.json
          BASELINE_PR: ${{ steps.baseline.outputs.pr }}
        run: node scripts/perf/report.mjs report

  # The owner added or removed the perf-growth label (task 0.13, D-142): the
  # head's newest run that reported judges its numbers again, in place, so its
  # check turns green (or red) with no new push. It loads no page, so it needs
  # neither the switch nor a measured run under the monthly cap.
  rejudge:
    if: github.event_name == 'pull_request' && github.event.label.name == 'perf-growth'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ github.event.pull_request.head.sha }}" }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc }
      - name: Re-run the head's last report
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/perf/report.mjs rejudge
