<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="./ledger-feel-tokens.css">
</helmet>
<sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
<nav aria-label="Main" style="position:relative;z-index:3;box-sizing:border-box;width:224px;height:100%;display:flex;flex-direction:column;gap:20px;padding:22px 16px 16px;background:var(--glass-bg);backdrop-filter:blur(20px) saturate(1.4);box-shadow:inset -1px 0 0 var(--rule);color:var(--ink);font-family:var(--sans)">
<span style="padding:0 8px;font:italic 500 24px/28px var(--display);letter-spacing:-.01em">Ledger</span>
<div role="group" aria-label="Medium" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;padding:2px;border-radius:10px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--rule)">
<sc-for list="{{ media }}" as="m" hint-placeholder-count="3"><a href="#" aria-current="{{ m.cur }}" style="height:32px;display:grid;place-items:center;border-radius:8px;background:{{ m.bg }};box-shadow:{{ m.sh }};color:{{ m.ink }};font:{{ m.weight }} 13px/1 var(--sans);text-decoration:none">{{ m.label }}</a></sc-for>
</div>
<div style="display:flex;flex-direction:column;gap:2px">
<sc-for list="{{ items }}" as="i" hint-placeholder-count="5"><a href="#" aria-current="{{ i.cur }}" style="position:relative;display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:8px;background:{{ i.bg }};color:{{ i.ink }};font:{{ i.weight }} 14px/1 var(--sans);text-decoration:none">{{ i.icon }}{{ i.label }}<span aria-hidden="true" style="position:absolute;left:-16px;top:6px;width:3px;height:28px;border-radius:0 3px 3px 0;background:{{ i.bar }}"></span></a></sc-for>
</div>
<div style="height:1px;margin:0 12px;background:var(--line)"></div>
<a href="#" aria-label="Inbox, {{ inbox }} waiting" style="display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:8px;color:var(--ink-2);font:500 14px/1 var(--sans);text-decoration:none"><svg aria-hidden="true" viewBox="0 0 24 24" style="flex:none;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg><span style="flex:1">Inbox</span><span style="font:500 11px/14px var(--mono);color:var(--muted)">{{ inbox }}</span></a>
<span style="flex:1"></span>
<span role="status" style="align-self:flex-start;display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 10px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--rule-2);color:var(--ink-2);font:500 12px/16px var(--sans)"><span aria-hidden="true" style="width:6px;height:6px;border-radius:50%;background:var(--ready)"></span>Synced 2 min ago</span>
</nav>
</sc-if>
<sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
<nav aria-label="Main" style="position:relative;z-index:3;box-sizing:border-box;width:64px;height:100%;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 0;background:var(--glass-bg);backdrop-filter:blur(20px) saturate(1.4);box-shadow:inset -1px 0 0 var(--rule);color:var(--ink);font-family:var(--sans)">
<span aria-label="Ledger" style="height:36px;display:grid;place-items:center;font:italic 500 24px/1 var(--display)">L</span>
<div role="group" aria-label="Medium" style="display:flex;flex-direction:column;gap:2px;padding:2px;border-radius:10px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--rule)">
<sc-for list="{{ media }}" as="m" hint-placeholder-count="3"><a href="#" aria-label="{{ m.label }}" aria-current="{{ m.cur }}" style="width:40px;height:36px;display:grid;place-items:center;border-radius:8px;background:{{ m.bg }};box-shadow:{{ m.sh }};color:{{ m.ink }}">{{ m.icon }}</a></sc-for>
</div>
<div style="display:flex;flex-direction:column;gap:2px">
<sc-for list="{{ items }}" as="i" hint-placeholder-count="5"><a href="#" aria-label="{{ i.label }}" aria-current="{{ i.cur }}" style="position:relative;width:44px;height:40px;display:grid;place-items:center;border-radius:8px;background:{{ i.bg }};box-shadow:{{ i.focus }};color:{{ i.ink }}">{{ i.icon }}<span aria-hidden="true" style="position:absolute;left:-10px;top:6px;width:3px;height:28px;border-radius:0 3px 3px 0;background:{{ i.bar }}"></span><sc-if value="{{ i.tip }}" hint-placeholder-val="{{ false }}"><span role="tooltip" style="position:absolute;left:calc(100% + 14px);top:50%;transform:translateY(-50%);z-index:5;padding:6px 10px;border-radius:6px;background:var(--overlay);box-shadow:inset 0 0 0 1px var(--rule-2),var(--sh-2);color:var(--ink);font:500 13px/16px var(--sans);white-space:nowrap">{{ i.label }}</span></sc-if></a></sc-for>
</div>
<div style="width:28px;height:1px;background:var(--line)"></div>
<a href="#" aria-label="Inbox, {{ inbox }} waiting" style="position:relative;width:44px;height:40px;display:grid;place-items:center;border-radius:8px;color:var(--ink-2)"><svg aria-hidden="true" viewBox="0 0 24 24" style="width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg><span aria-hidden="true" style="position:absolute;top:2px;right:0;min-width:18px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:999px;background:var(--raise);box-shadow:inset 0 0 0 1px var(--rule-2);color:var(--ink-2);font:600 11px/16px var(--mono);text-align:center">{{ inbox }}</span></a>
<span style="flex:1"></span>
<span role="status" aria-label="Synced 2 min ago" style="width:44px;height:40px;display:grid;place-items:center"><span aria-hidden="true" style="width:8px;height:8px;border-radius:50%;background:var(--ready)"></span></span>
</nav>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:224,&quot;height&quot;:900},&quot;medium&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;comics&quot;,&quot;books&quot;],&quot;default&quot;:&quot;comics&quot;,&quot;tsType&quot;:&quot;'comics'|'books'&quot;},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dash&quot;,&quot;status&quot;,&quot;runs&quot;,&quot;tracks&quot;,&quot;add&quot;,&quot;plan&quot;,&quot;shelves&quot;,&quot;top&quot;],&quot;default&quot;:&quot;dash&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;collapsed&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;tip&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;inbox&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:6,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const P = this.props;
    const med = P.medium ?? 'comics', cur = P.current ?? 'dash', narrow = !!(P.collapsed ?? false), tip = P.tip ?? '';
    const ICONS = {"layout-dashboard":[["rect",{"width":"7","height":"9","x":"3","y":"3","rx":"1"}],["rect",{"width":"7","height":"5","x":"14","y":"3","rx":"1"}],["rect",{"width":"7","height":"9","x":"14","y":"12","rx":"1"}],["rect",{"width":"7","height":"5","x":"3","y":"16","rx":"1"}]],"list-checks":[["path",{"d":"M13 5h8"}],["path",{"d":"M13 12h8"}],["path",{"d":"M13 19h8"}],["path",{"d":"m3 17 2 2 4-4"}],["path",{"d":"m3 7 2 2 4-4"}]],"layers":[["path",{"d":"M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"}],["path",{"d":"M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"}],["path",{"d":"M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"}]],"route":[["circle",{"cx":"6","cy":"19","r":"3"}],["path",{"d":"M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"}],["circle",{"cx":"18","cy":"5","r":"3"}]],"plus":[["path",{"d":"M5 12h14"}],["path",{"d":"M12 5v14"}]],"calendar-range":[["rect",{"x":"3","y":"3","width":"18","height":"18","rx":"2"}],["path",{"d":"M16 2v3"}],["path",{"d":"M3 9h18"}],["path",{"d":"M8 2v3"}],["path",{"d":"M17 13h-6"}],["path",{"d":"M13 17H7"}],["path",{"d":"M7 13h.01"}],["path",{"d":"M17 17h.01"}]],"library":[["path",{"d":"m16 6 4 14"}],["path",{"d":"M12 6v14"}],["path",{"d":"M8 8v12"}],["path",{"d":"M4 4v16"}]],"list-ordered":[["path",{"d":"M11 5h10"}],["path",{"d":"M11 12h10"}],["path",{"d":"M11 19h10"}],["path",{"d":"M4 4h1v5"}],["path",{"d":"M4 9h2"}],["path",{"d":"M6.5 20H3.4c0-1 2.6-1.925 2.6-3.5a1.5 1.5 0 0 0-2.6-1.02"}]],"book-open":[["path",{"d":"M12 5v16"}],["path",{"d":"M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z"}]],"book":[["path",{"d":"M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"}]],"tv":[["path",{"d":"m17 2-5 5-5-5"}],["rect",{"width":"20","height":"15","x":"2","y":"7","rx":"2"}]]};
    const ic = (n, sz = 20) => React.createElement('svg', { viewBox: '0 0 24 24', 'aria-hidden': true, width: sz, height: sz, style: { flex: 'none', display: 'block', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' } }, (ICONS[n] || []).map(([t, a], k) => React.createElement(t, Object.assign({ key: k }, a))));
    const hue = med === 'books' ? 'var(--m-books)' : 'var(--m-comics)';
    const media = [['comics', 'Comics', 'book-open'], ['books', 'Books', 'book'], ['watch', 'Watch', 'tv']].map(([k, label, icon]) => {
      const on = k === med;
      return { label, icon: ic(icon, 18), cur: on ? 'page' : 'false', bg: on ? 'var(--surface)' : 'transparent', sh: on ? 'var(--sh-1)' : 'none', ink: on ? 'var(--ink)' : 'var(--muted)', weight: on ? 600 : 500 };
    });
    const sets = {
      comics: [['dash', 'Dashboard', 'layout-dashboard'], ['status', 'Status', 'list-checks'], ['runs', 'Runs', 'layers'], ['tracks', 'Tracks', 'route'], ['add', 'Add', 'plus']],
      books: [['dash', 'Dashboard', 'layout-dashboard'], ['status', 'Status', 'list-checks'], ['plan', 'Plan', 'calendar-range'], ['shelves', 'Shelves', 'library'], ['top', 'Top', 'list-ordered'], ['add', 'Add', 'plus']]
    };
    const items = (sets[med] || sets.comics).map(([k, label, icon]) => {
      const on = k === cur, t = k === tip;
      return { label, icon: ic(icon), cur: on ? 'page' : 'false', bg: on ? 'var(--raise)' : 'transparent', ink: on ? 'var(--ink)' : 'var(--ink-2)', weight: on ? 600 : 500, bar: on ? hue : 'transparent', tip: t, focus: t ? 'var(--focus-ring)' : 'none' };
    });
    return { wide: !narrow, narrow, media, items, inbox: String(P.inbox ?? 6) };
  }
}
</script>
</body>
</html>
