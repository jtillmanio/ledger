<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:grid;grid-template-columns:{{ cols }};gap:28px;align-items:start">
<sc-for list="{{ frames }}" as="f" hint-placeholder-count="2">
<div role="figure" aria-label="{{ f.aria }}" style="{{ f.vars }};width:{{ f.width }}px;box-sizing:border-box;background:var(--page);color:var(--ink);font-family:var(--sans);border:1px solid var(--rule);border-radius:{{ f.frameR }}px;padding:{{ f.pad }}px;overflow:hidden">
  <div style="display:flex;align-items:baseline;gap:10px;margin:0 0 12px">
    <span style="font:700 {{ f.h1 }}px/1.15 var(--sans);letter-spacing:-.028em">Books</span>
    <span style="font:600 11px/14px var(--sans);color:var(--m-books);border:1px solid var(--m-books);border-radius:999px;padding:1px 8px;white-space:nowrap">time · words</span>
    <span style="margin-left:auto;font:500 11px/14px var(--mono);letter-spacing:.08em;color:var(--faint)">{{ f.tag }}</span>
  </div>
  <div style="background:var(--surface);border-radius:16px;box-shadow:inset 0 0 0 1px var(--rule),var(--sh-1);padding:{{ f.cardPad }}px">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <div style="font:500 11px/14px var(--mono);letter-spacing:.08em;color:var(--faint)">PLAN · 2027</div>
      <div role="tablist" aria-label="Granularity" style="margin-left:auto;display:inline-flex;padding:2px;border-radius:8px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--rule)">
        <button role="tab" aria-selected="{{ f.qSel }}" style="min-height:28px;padding:0 12px;border:0;border-radius:6px;font:600 12px/16px var(--sans);background:{{ f.qBg }};color:{{ f.qInk }};box-shadow:{{ f.qSh }}">Quarter</button>
        <button role="tab" aria-selected="{{ f.mSel }}" style="min-height:28px;padding:0 12px;border:0;border-radius:6px;font:600 12px/16px var(--sans);background:{{ f.mBg }};color:{{ f.mInk }};box-shadow:{{ f.mSh }}">Month</button>
      </div>
    </div>
    <sc-if value="{{ f.showDelta }}" hint-placeholder-val="{{ false }}">
      <output aria-live="polite" style="display:inline-flex;margin-top:10px;font:600 12px/16px var(--mono);padding:4px 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand-ink);box-shadow:inset 0 0 0 1px var(--brand)">{{ f.delta }}</output>
    </sc-if>
    <div style="overflow-x:{{ f.ovx }};scroll-snap-type:x mandatory;margin:14px -{{ f.cardPad }}px 0;padding:0 {{ f.cardPad }}px">
      <div style="position:relative;width:{{ f.railW }}px;height:{{ f.totalH }}px">
        <sc-for list="{{ f.cols }}" as="c" hint-placeholder-count="4">
          <div style="position:absolute;left:{{ c.x }}px;top:0;width:{{ c.w }}px;height:{{ f.H }}px;scroll-snap-align:start;border-left:{{ c.lane }}">
            <sc-for list="{{ c.blocks }}" as="b" hint-placeholder-count="3">
              <button aria-label="{{ b.aria }}" style="position:absolute;left:{{ c.inset }}px;right:0;top:{{ b.y }}px;height:{{ b.h }}px;padding:0;border:{{ b.border }};border-radius:3px;cursor:pointer;background:{{ b.bg }};box-shadow:{{ b.ring }};border-top:{{ b.top }};box-sizing:border-box;overflow:hidden;text-align:left;font:inherit;color:var(--ink)">
                <span style="position:absolute;left:0;top:0;bottom:0;width:3px;background:var({{ b.hue }})"></span>
                <span style="position:absolute;left:0;right:0;top:0;height:{{ b.overH }}px;background-color:var(--blocked-soft);background-image:{{ b.hatch }};opacity:.95"></span>
                <span style="position:relative;display:flex;flex-direction:column;align-items:{{ b.align }};padding:3px 4px 0 7px">
                  <span style="max-width:100%;font:600 11px/14px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:{{ b.chip }};padding:0 3px;border-radius:3px">{{ b.title }}</span>
                  <span style="font:500 11px/14px var(--mono);color:var(--muted);background:{{ b.chip }};padding:0 3px;border-radius:3px">{{ b.sub }}</span>
                </span>
              </button>
            </sc-for>
            <div style="position:absolute;left:0;right:0;top:{{ f.footY }}px;border-top:1px solid var(--rule);padding-top:6px;text-align:center">
              <div style="font:600 12px/16px var(--sans)">{{ c.name }}</div>
              <div style="font:500 11px/14px var(--mono);color:var(--muted);margin-top:2px">{{ c.sum }}</div>
              <span style="display:inline-block;margin-top:4px;font:600 11px/14px var(--mono);padding:2px 6px;border-radius:6px;background:var({{ c.bBg }});color:var({{ c.bInk }})">{{ c.badge }}</span>
            </div>
          </div>
        </sc-for>
        <div aria-hidden="true" style="position:absolute;left:0;width:{{ f.capW }}px;top:{{ f.capY }}px;border-top:1.5px dashed var(--ink-2);pointer-events:none;z-index:2">
          <span style="position:absolute;right:0;top:-18px;font:600 11px/14px var(--mono);color:var(--ink-2);background:var(--surface);padding:1px 4px;border-radius:4px">{{ f.capLabel }}</span>
        </div>
        <sc-if value="{{ f.ghost.show }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;z-index:3;left:{{ f.ghost.x }}px;top:{{ f.ghost.y }}px;width:{{ f.ghost.w }}px;height:{{ f.ghost.h }}px;border-radius:3px;background:var(--reading-soft);outline:2px dashed var(--brand);outline-offset:1px;box-shadow:var(--sh-2);transform:rotate(-1.5deg);display:flex;align-items:center;padding-left:8px;font:600 11px/14px var(--sans)">The Talisman · ~99k</div>
          <div style="position:absolute;z-index:1;left:{{ f.ghost.fromX }}px;top:{{ f.ghost.fromY }}px;width:{{ f.ghost.w }}px;height:{{ f.ghost.h }}px;border-radius:3px;border:1px dashed var(--faint-deco);box-sizing:border-box"></div>
        </sc-if>
      </div>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font:500 11px/14px var(--sans);color:var(--muted)">
      <span style="display:inline-flex;align-items:center;gap:5px"><i style="width:18px;border-top:1.5px dotted var(--muted)"></i>~ estimated (pages × 275)</span>
      <span style="display:inline-flex;align-items:center;gap:5px"><i style="width:12px;height:10px;border-radius:2px;background-color:var(--blocked-soft);background-image:{{ f.legendHatch }}"></i>{{ f.legendOver }}</span>
      <span style="display:inline-flex;align-items:center;gap:5px"><i style="width:12px;height:10px;border-radius:2px;border:1px dashed var(--faint-deco);box-sizing:border-box"></i>+N · merged under 24px</span>
      <span style="display:inline-flex;align-items:center;gap:5px"><i style="width:12px;height:10px;border-radius:2px;border:1px dashed var(--blocked);background:var(--blocked-soft);box-sizing:border-box"></i>year, no quarter</span>
    </div>
    <div style="display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:12px;border-radius:12px;background:{{ f.decBg }};box-shadow:inset 0 0 0 1px {{ f.decRing }}">
      <span aria-hidden="true" style="flex:none;width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 2px {{ f.decInk }};color:{{ f.decInk }};display:grid;place-items:center;font:700 11px/1 var(--sans)">{{ f.decGlyph }}</span>
      <div style="font:400 13px/18px var(--sans);color:var(--ink-2);flex:1;min-width:0">{{ f.decText }}</div>
      <button style="flex:none;min-height:32px;padding:0 12px;border-radius:8px;border:0;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule-2);font:600 13px/18px var(--sans)">{{ f.decBtn }}</button>
    </div>
  </div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1420,&quot;height&quot;:1100},&quot;gran&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;quarter&quot;,&quot;month&quot;],&quot;default&quot;:&quot;quarter&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;rest&quot;,&quot;drag&quot;,&quot;settled&quot;],&quot;default&quot;:&quot;rest&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;themes&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;both&quot;,&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;both&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  books() {
    return {
      q: [
        [{t:'The Way of Kings',k:387,h:'--g5'},{t:'Mistborn',k:214,h:'--g5'},{t:'The Talisman',k:99,h:'--g2',e:1},{t:'Piranesi',k:65,h:'--g6',e:1},{t:'Coraline',k:39,h:'--g2'},{t:'Novella',k:28,h:'--g6'},{t:'The Butcher of the Forest',k:22,h:'--g5'},{t:'Ghost Story',k:20,h:'--g2',e:1},{t:'The Tusks of Extinction',k:18,h:'--g1'}],
        [{t:'Dune',k:188,h:'--g1'},{t:'Hyperion',k:180,h:'--g1'},{t:'Rebecca',k:145,h:'--g4'},{t:'The Hobbit',k:95,h:'--g5'},{t:'Sea of Tranquility',k:60,h:'--g6',e:1},{t:'Kindred',k:36,h:'--g4'}],
        [{t:'Anathem',k:350,h:'--g1'},{t:'Klara and the Sun',k:65,h:'--g6',e:1}],
        [{t:"The Wise Man's Fear",k:400,h:'--g5'},{t:'Circe',k:110,h:'--g6'},{t:'The Remains of the Day',k:102,h:'--g4',e:1}]
      ],
      un: [{t:'Rhythm of War',k:455,h:'--g5'},{t:'Babel',k:120,h:'--g6',e:1},{t:'The Library at Mount Char',k:80,h:'--g2'}],
      months: [[0],[1,2],[3,4,5,6,7,8],[0,1],[2,3],[4,5],[0],[1],[],[0],[1],[2]]
    };
  }
  stackCol(list, H, px, capY, settled, labelled, dragOut) {
    const out = []; let bottom = H; const pending = [];
    const fmt = b => (b.e ? '~' : '') + b.k + 'k';
    const flush = () => {
      if (!pending.length) return;
      if (pending.length === 1) { const b = pending[0]; pending.length = 0; place(b, -1, true); return; }
      const sum = pending.reduce((a,b)=>a+b.k,0), h = Math.max(24, sum*px + 2*(pending.length-1)), y = bottom - h;
      out.push({y, h, bg:'var(--raise)', ring:'none', top:'1px dashed var(--faint-deco)', border:'1px dashed var(--faint-deco)', hue:'--raise', overH: y < capY ? Math.min(h, capY - y) : 0, title:'+' + pending.length, sub: sum + 'k', align:'center',
        aria:`${pending.length} books, ${sum}k words — open list`, stack:true});
      bottom = y - 2; pending.length = 0;
    };
    const place = (b, i, small) => {
      const h = Math.max(small ? 6 : 0, b.k*px), y = bottom - h, isGhostSrc = dragOut === i;
      const overH = y < capY ? Math.min(h, capY - y) : 0;
      out.push({border:'0', y, h, bg: isGhostSrc ? 'transparent' : 'var(--reading-soft)', ring: isGhostSrc ? 'inset 0 0 0 1px transparent' : (overH ? 'inset 0 0 0 1px var(--blocked)' : 'inset 0 0 0 1px var(--rule)'),
        top: b.e ? '1.5px dotted var(--muted)' : '0', hue: isGhostSrc ? '--surface' : b.h, overH: isGhostSrc ? 0 : overH, title: labelled && h >= 18 && !isGhostSrc ? b.t : '', sub: labelled && h >= 32 && !isGhostSrc ? fmt(b) : '', align:'left',
        aria:`${b.t}, ${b.k}k words, ${b.e?'estimated':'stated'}`});
      bottom = y - 2;
    };
    list.forEach((b, i) => { if (b.k*px < 24) { pending.push(b); return; } flush(); place(b, i, false); });
    flush();
    out.forEach(o => { o.chip = o.overH ? 'var(--surface)' : 'transparent'; if (o.align === 'center') o.align = 'center'; else o.align = 'flex-start'; o.hatch = settled ? 'repeating-linear-gradient(135deg,var(--muted) 0 1px,transparent 1px 6px)' : 'repeating-linear-gradient(135deg,var(--blocked) 0 1.5px,transparent 1.5px 6px)'; });
    return out;
  }
  geom(frame) {
    const gran = this.props.gran ?? 'quarter', state = this.props.state ?? 'rest', desk = frame >= 700;
    const settled = state === 'settled', drag = state === 'drag' && desk;
    const pad = desk ? 24 : 16, cardPad = desk ? 20 : 16, inner = frame - 2 - pad*2 - cardPad*2;
    const B = this.books(), H = desk ? 300 : 230, gap = desk ? 10 : 6;
    const cols = []; let capY, capW, capLabel, railW, maxK;
    const hueBadge = (sum, cap) => sum > cap
      ? (settled ? [(desk ? 'stretch · ' : '+') + (sum-cap) + 'k', '--sunk', '--muted'] : [(desk ? 'over ' : '+') + (sum-cap) + 'k', '--blocked-soft', '--blocked'])
      : (desk ? [(cap-sum) + 'k room', '--sunk', '--muted'] : ['', 'transparent', 'transparent']);
    if (gran === 'month') {
      maxK = 450; const cap = 253, px = H/maxK; capY = H - cap*px;
      const colW = desk ? Math.floor((inner - 120 - gap*12) / 12) : 64; railW = 12*(colW+gap);
      capW = railW - gap;
      const names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      B.months.forEach((idx, m) => {
        const q = B.q[Math.floor(m/3)], list = idx.map(i=>q[i]); const sum = list.reduce((a,b)=>a+b.k,0);
        const [badge, bBg, bInk] = sum ? hueBadge(sum, cap) : ['253k room','--sunk','--muted'];
        cols.push({x: m*(colW+gap), w: colW, inset: 0, lane: m%3===0 && m ? '1px solid var(--line)' : '0', blocks: this.stackCol(list, H, px, capY, settled, desk), name: names[m], sum: sum + 'k', badge, bBg, bInk});
      });
      if (desk) { const lx = railW + 8; cols.push({x: lx, w: 104, inset: 8, lane:'1px dashed var(--blocked)', blocks: this.stackCol(B.un, H, px, -1, false, true).map(b=>Object.assign(b,{bg:'var(--blocked-soft)', ring:'inset 0 0 0 1px var(--blocked)', overH:0})), name:'2027', sum:'655k', badge:'no month', bBg:'--blocked-soft', bInk:'--blocked'}); railW = lx + 104; }
      capLabel = '253k / month';
    } else {
      maxK = 1000; const cap = 760, px = H/maxK; capY = H - cap*px;
      const laneW = desk ? 150 : 52, colW = Math.floor((inner - laneW - gap*4) / 4);
      B.q.forEach((list, qi) => {
        const sum = list.reduce((a,b)=>a+b.k,0); const [badge, bBg, bInk] = hueBadge(sum, cap);
        cols.push({x: qi*(colW+gap), w: colW, inset: 0, lane:'0', blocks: this.stackCol(list, H, px, capY, settled, true, drag && qi===0 ? 2 : -1), name:'Q' + (qi+1), sum: sum + 'k / 760k', badge, bBg, bInk});
      });
      capW = 4*(colW+gap) - gap;
      const lx = 4*(colW+gap);
      cols.push({x: lx, w: laneW, inset: 6, lane:'1px dashed var(--blocked)', blocks: this.stackCol(B.un, H, px, -1, false, desk).map(b=>Object.assign(b,{bg:'var(--blocked-soft)', ring:'inset 0 0 0 1px var(--blocked)', overH:0})), name: desk ? '2027 · no quarter' : '2027', sum: '655k', badge: desk ? '3 to place' : '3', bBg:'--blocked-soft', bInk:'--blocked'});
      railW = lx + laneW; capLabel = '760k';
      cols.forEach(c => { if (!desk && c.name.startsWith('Q')) c.sum = c.sum.replace(' / 760k',''); });
    }
    let ghost = {show:false};
    if (drag && gran === 'quarter') {
      const src = cols[0].blocks.find(b => b.aria.startsWith('The Talisman')), q3 = cols[2];
      const topQ3 = Math.min.apply(null, q3.blocks.map(b=>b.y));
      ghost = {show:true, x:q3.x + 10, y: topQ3 - src.h - 10, w: q3.w - 4, h: src.h, fromX: cols[0].x, fromY: src.y};
    }
    const total = B.q.flat().reduce((a,b)=>a+b.k,0) + B.un.reduce((a,b)=>a+b.k,0), pct = Math.round(total/3040*100);
    const on = ['var(--surface)','var(--ink)','var(--sh-1), inset 0 0 0 1px var(--rule)'], off = ['transparent','var(--muted)','none'];
    const q = gran === 'quarter' ? on : off, m = gran === 'month' ? on : off;
    return {
      aria: `Plan rail — ${gran} — ${desk?'desktop':'phone'}`, tag: (gran === 'month' ? 'MONTH' : 'QUARTER') + (settled ? ' · SETTLED' : drag ? ' · DRAG' : ''),
      frameR: desk ? 14 : 28, pad, cardPad, h1: desk ? 30 : 24,
      qSel: String(gran==='quarter'), mSel: String(gran==='month'), qBg:q[0], qInk:q[1], qSh:q[2], mBg:m[0], mInk:m[1], mSh:m[2],
      H, footY: H + 8, totalH: H + 70, cols, railW: Math.round(railW), capY: Math.round(capY), capW: Math.round(capW), capLabel,
      ovx: (!desk && gran === 'month') ? 'auto' : 'visible', ghost, showDelta: drag, delta: 'Q3 +99k → 514k / 760k',
      legendHatch: settled ? 'repeating-linear-gradient(135deg,var(--muted) 0 1px,transparent 1px 6px)' : 'repeating-linear-gradient(135deg,var(--blocked) 0 1.5px,transparent 1.5px 6px)',
      legendOver: settled ? 'over, accepted (settled)' : 'over capacity (held)',
      decBg: settled ? 'var(--surface)' : 'var(--blocked-soft)', decRing: settled ? 'var(--rule)' : 'var(--blocked)', decInk: settled ? 'var(--muted)' : 'var(--blocked)', decGlyph: settled ? '✓' : '!',
      decText: settled ? '2027 accepted as a stretch year on 14 Sep.' : `2027 is at ${pct}% of capacity — ${(total/1000).toFixed(2)}M planned against 3.04M. Decide how to hold it.`,
      decBtn: settled ? 'Undo' : 'Rebalance'
    };
  }
  renderVals() {
    const themes = this.props.themes ?? 'both';
    const V = {dark:"--page:#0a0c10;--surface:#12151b;--raise:#191d25;--sunk:#0d1015;--overlay:#1e232c;--ink:#e8ebf0;--ink-2:#b9c0cc;--muted:#8f98a7;--faint:#8a93a2;--faint-deco:#646d7a;--rule:#252a33;--rule-2:#323945;--line:#1c2028;--brand:#86a4ff;--brand-soft:#172039;--brand-ink:#a9bfff;--ready:#52c496;--blocked:#e0a866;--blocked-soft:#261c10;--reading-soft:#172039;--g1:#6f9bff;--g2:#e879f9;--g4:#fde047;--g5:#a98aee;--g6:#4fb3cc;--m-books:#4fb3cc;--sh-1:inset 0 1px 0 rgba(255,255,255,.03);--sh-2:inset 0 1px 0 rgba(255,255,255,.05),0 8px 24px -12px rgba(0,0,0,.7);--sans:'Inter Tight',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;color-scheme:dark",
      light:"--page:#f3f5f8;--surface:#fff;--raise:#f8f9fb;--sunk:#ebeef2;--overlay:#fff;--ink:#12151c;--ink-2:#3a4250;--muted:#5c6575;--faint:#5f6878;--faint-deco:#848d9b;--rule:#dfe3e9;--rule-2:#c7cdd7;--line:#eceef2;--brand:#2148c9;--brand-soft:#e8edfd;--brand-ink:#1a3aa3;--ready:#0b7a52;--blocked:#8a560c;--blocked-soft:#fbefdf;--reading-soft:#e8edfd;--g1:#2563eb;--g2:#a21caf;--g4:#857700;--g5:#7c3aed;--g6:#0e7490;--m-books:#0e7490;--sh-1:0 1px 2px rgba(18,21,28,.04);--sh-2:0 1px 2px rgba(18,21,28,.05),0 8px 24px -12px rgba(18,21,28,.18);--sans:'Inter Tight',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;color-scheme:light"};
    const list = themes === 'both' ? ['dark','light'] : [themes];
    const g390 = this.geom(390), g1000 = this.geom(1000), frames = [];
    list.forEach(t => { frames.push(Object.assign({vars:V[t], width:390}, g390)); frames.push(Object.assign({vars:V[t], width:1000}, g1000)); });
    return { frames, cols:'390px 1000px' };
  }
}
</script>
</body>
</html>
